# cargo-deny configuration
# Enforces license compliance, bans risky crates, detects vulnerabilities.
# Run: cargo deny check
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

# ------ Licenses ------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# ------ Bans ------
[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = []

# ------ Advisories ------
[advisories]
yanked = "deny"
unmaintained = "none"

# ------ Sources ------
[sources]
# Only allow crates from crates.io (prevent typosquatting from alt registries)
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index"
]
allow-git = []
