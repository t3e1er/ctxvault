# ctxvault Standardized Benchmark Manifest
# Defines canonical benchmark suites, query fixtures, and target repositories.

[swe_bench]
name = "SWE-bench Lite"
queries = "benchmarks/data/swe_bench.json"
repos = [
    { slug = "pallets/flask", url = "https://github.com/pallets/flask.git" },
    { slug = "psf/requests", url = "https://github.com/psf/requests.git" },
    { slug = "astropy/astropy", url = "https://github.com/astropy/astropy.git" }
]

[repobench]
