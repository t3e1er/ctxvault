[workspace]
resolver = "2"
members = [
    "crates/cxtvault-core",
    "crates/cxtvault-mcp",
    "crates/cxtvault-cli",
    "crates/cxtvault-common",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/cxtvault"
authors = ["Trent <trent@example.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_results = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Selectively allow things that are too noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"

# MCP protocol
# rmcp = "0.1"  # uncomment when adding MCP integration

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1"
bincode = "1.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Markdown parsing
pulldown-cmark = "0.12"

# Full-text search (BM25)
tantivy = "0.22"

# Vector search
hnsw_rs = "0.3"

# Embeddings
fastembed = "4"

# Knowledge graph
petgraph = { version = "0.6", features = ["serde-1"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# File watching
notify = "7.0"
notify-debouncer-full = "0.4"

# Hashing
blake3 = "1.5"

# CLI
clap = { version = "4.5", features = ["derive"] }

# HTTP (for server and client mode)
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Testing
tempfile = "3.12"
assert_fs = "1.1"
predicates = "3.1"

[profile.release]
debug = 1  # Line tables only — small binary size increase, useful backtraces
