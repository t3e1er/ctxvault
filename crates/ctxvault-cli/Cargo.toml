[package]
name = "ctxvault-cli"
description = "CLI binary: argument parsing, mode selection, startup orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "ctxvault"
path = "src/main.rs"

[dependencies]
ctxvault-common = { path = "../ctxvault-common" }
ctxvault-core = { path = "../ctxvault-core" }
ctxvault-mcp = { path = "../ctxvault-mcp" }

# Async
tokio = { workspace = true }

# CLI
clap = { workspace = true }

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization
toml = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

[features]
default = []

