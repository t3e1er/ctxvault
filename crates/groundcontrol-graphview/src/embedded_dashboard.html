<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GroundControl GraphView</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2307090e' stroke='%2338bdf8' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2338bdf8'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(13, 17, 26, 0.82);
      --panel-border: rgba(56, 189, 248, 0.22);
      --neon-blue: #38bdf8;
      --neon-purple: #a855f7;
      --neon-emerald: #10b981;
      --neon-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text-main);
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .glass-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
    }

    /* Header HUD */
    #header-mount {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 10;
      pointer-events: none;
    }

    .hud-header {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
    }

    .header-left, .header-center, .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-weight: 800;
      letter-spacing: 0.08em;
      font-size: 13px;
      color: var(--text-main);
    }

    .brand-sub {
      color: var(--neon-blue);
      font-weight: 500;
    }

    .hud-select {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    .hud-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--panel-border);
      color: var(--neon-blue);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.15s ease;
    }

    .hud-btn:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .pill-group {
      display: flex;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 2px;
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .pill-btn.active {
      background: rgba(56, 189, 248, 0.2);
      color: var(--neon-blue);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .stats-badge {
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-highlight {
      color: #38bdf8;
      font-weight: bold;
    }

    /* Filter Panel */
    #filter-mount {
      position: absolute;
      top: 76px;
      left: 14px;
      bottom: 60px;
      width: 260px;
      z-index: 10;
      pointer-events: none;
    }

    .filter-panel {
      pointer-events: auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 16px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 6px 10px;
      gap: 8px;
    }

    .hud-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 12px;
      width: 100%;
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .chips-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chips-container.scrollable {
      overflow-y: auto;
      max-height: 240px;
      padding-right: 4px;
    }

    .chips-container.scrollable::-webkit-scrollbar {
      width: 4px;
    }

    .chips-container.scrollable::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .filter-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      cursor: pointer;
      opacity: 0.45;
      transition: all 0.15s ease;
    }

    .filter-chip.active {
      opacity: 1;
      background: rgba(15, 23, 42, 0.9);
      border-color: rgba(56, 189, 248, 0.35);
    }

    .chip-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .chip-label {
      flex: 1;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chip-count {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Header Search Box */
    .header-search {
      width: 260px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .header-search:focus-within {
      border-color: var(--neon-amber);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
    }

    /* Visual Controls Section Docked Inside Sidebar */
    .visual-controls-panel {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
      margin-top: auto;
      display: flex;
      flex-direction: column;
    }

    .visual-controls-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 6px 4px;
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .visual-controls-header:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .visual-controls-chevron {
      transition: transform 0.25s ease;
      color: var(--text-muted);
    }

    .visual-controls-panel.collapsed .visual-controls-chevron {
      transform: rotate(-90deg);
    }

    .visual-controls-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px 4px 4px 4px;
    }

    .visual-controls-panel.collapsed .visual-controls-body {
      display: none;
    }

    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
    }

    .slider-row input[type="range"] {
      width: 115px;
      accent-color: var(--neon-blue);
      cursor: pointer;
    }

    /* Right Agent Activity Stream */
    #telemetry-mount {
      position: absolute;
      top: 76px;
      right: 14px;
      bottom: 24px;
      width: 310px;
      z-index: 10;
      pointer-events: none;
    }

    .agent-hud {
      pointer-events: auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .agent-hud.collapsed {
      transform: translateX(calc(100% + 20px));
      opacity: 0;
      pointer-events: none;
    }

    .agent-hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .agent-hud-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-main);
    }

    .telemetry-stream {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }

    .telemetry-stream::-webkit-scrollbar {
      width: 4px;
    }

    .telemetry-stream::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.25);
      border-radius: 4px;
    }

    .telemetry-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .telemetry-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .telemetry-card-desc {
      font-size: 11px;
      color: var(--text-main);
      word-break: break-all;
    }

    .telemetry-card-paths {
      font-size: 10px;
      color: var(--text-muted);
      max-height: 40px;
      overflow: hidden;
    }

    .telemetry-live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .telemetry-live-dot.pulse {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .telemetry-idle {
      color: var(--text-muted);
      font-size: 11px;
      text-align: center;
      margin-top: 30px;
    }

    .agent-tag {
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid;
      font-weight: 600;
      font-size: 10px;
    }

    .telemetry-tool {
      color: #f8fafc;
      font-weight: 500;
      font-size: 11px;
    }

    .telemetry-time {
      color: #64748b;
      font-size: 10px;
    }

    /* Inspector positioning docked cleanly at bottom */
    #inspector-mount {
      position: absolute;
      bottom: 20px;
      left: 290px;
      right: 340px;
      z-index: 15;
      display: none;
      pointer-events: none;
    }

    .inspector-panel {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      gap: 16px;
    }

    .inspector-meta {
      flex: 1 1 auto;
      min-width: 0;
    }

    .node-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      border: 1px solid;
      border-radius: 4px;
      padding: 1px 6px;
      margin-bottom: 3px;
    }

    .node-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node-path {
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node-metrics {
      display: flex;
      gap: 18px;
      flex-shrink: 0;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .metric-val {
      font-size: 13px;
      font-weight: 700;
      color: var(--neon-blue);
    }

    .metric-lbl {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .inspector-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .hud-action-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--neon-blue);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .hud-action-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .close-btn:hover {
      color: #fff;
    }
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 50;
      background: rgba(7, 9, 14, 0.75);
      backdrop-filter: blur(8px);
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .loading-overlay.hidden {
      display: none;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(56, 189, 248, 0.15);
      border-top-color: var(--neon-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--neon-blue);
      letter-spacing: 0.05em;
    }
